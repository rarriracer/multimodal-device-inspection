[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-device-inspection"
version = "0.1.0"
description = "Local text and image analysis with evidence-aware human review."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
training = ["scikit-learn>=1.4,<2"]
vision = ["torch>=2.3,<3", "torchvision>=0.18,<1"]
detection = ["ultralytics>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]
